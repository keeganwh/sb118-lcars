<!-- Preferences-driven overrides injected here -->
<style id="prefs-style"></style>
<script>
/* Delta Prime first paint — runs before <body> so the app never boots in the
   wrong skin and corrects itself. Reads a tiny mirror key (lcars_style_v1)
   rather than parsing the ~900 KB main payload. Kept deliberately dependency
   free; the real state lives in S.settings.style and is written back on save. */
(function(){
  var DUTY={command:{calmLight:'#B4463C',epicLight:'#C0433A',dark:'#F0705F'},
            science:{calmLight:'#2F7FC9',epicLight:'#2F7FC9',dark:'#5FB2FF'},
            operations:{calmLight:'#C8901C',epicLight:'#C8901C',dark:'#F2B441'},
            medical:{calmLight:'#1E8E7E',epicLight:'#1E8E7E',dark:'#48D3BE'}};
  var d={skin:'prime',duty:'command',mode:'system',vibe:'calm'},s=d;
  try{var r=localStorage.getItem('lcars_style_v1');if(r){var p=JSON.parse(r);if(p&&typeof p==='object')s={skin:p.skin||d.skin,duty:p.duty||d.duty,mode:p.mode||d.mode,vibe:p.vibe||d.vibe};}}catch(e){}
  var mode=s.mode;
  if(mode==='system'){try{mode=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}catch(e){mode='dark';}}
  var b=document.documentElement;
  window.__lcarsStyleBoot={settings:s,resolvedMode:mode,DUTY:DUTY};
  /* Attributes live on <html>; the skin CSS is scoped :root[data-skin] body. */
  b.setAttribute('data-skin',s.skin);
  b.setAttribute('data-mode',mode);
  b.setAttribute('data-vibe',s.vibe);
  b.setAttribute('data-duty',s.duty);
  var t=DUTY[s.duty]||DUTY.command;
  b.style.setProperty('--ac',mode==='dark'?t.dark:(s.vibe==='epic'?t.epicLight:t.calmLight));
  if(s.skin==='prime'){
    var l=document.createElement('link');l.rel='stylesheet';l.id='gf-delta-prime';
    l.href='https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap';
    document.head.appendChild(l);
  }
})();
</script>

              onmouseleave="schedCloseTbDd('af')">
              <button class="tbb tbb-names" id="tbb-bn" onclick="toggleAutoBold()" title="Auto-bold character names — toggle on applies bold, toggle off removes it"><strong>B Names</strong></button>
              <button class="tbb tbb-names" id="tbb-bl" onclick="toggleBoldLocations()" title="Auto-bold ((Location)) markers"><strong>B Locations</strong></button>
              <button class="tbb tbb-names" id="tbb-it" onclick="toggleItalicThoughts()" title="Auto-italicize oO Thoughts Oo"><em>Italic Thoughts</em></button>
              <button class="tbb tbb-names" id="tbb-oi" onclick="toggleItalicOOC()" title="Auto-italicize ((OOC - ...)) markers"><em>Italic OOCs</em></button>
            </div>
          </div>
          <div class="tb-dd-wrap">
            <button class="tbb tbb-names" id="tbb-va-btn"
              onclick="toggleTbDropdown('va')"
              onmouseenter="openTbDd('va')"
              onmouseleave="schedCloseTbDd('va')"
              title="Visual Aids — toggle highlights for Actions, Comms, Thoughts">Visual Aids <svg class="ic" aria-hidden="true"><use href="#i-chevron-down"/></svg></button>
            <div class="tb-dd" id="tb-dd-va"
              onmouseenter="cancelCloseTbDd()"
              onmouseleave="schedCloseTbDd('va')">
              <button class="tbb tbb-names fmt-on" id="tbb-am" onclick="toggleFmt('action')" title="Toggle ::Actions:: highlighting — marks stage direction / action lines">::Actions::</button>
              <button class="tbb tbb-names fmt-on" id="tbb-cm" onclick="toggleFmt('comms')" title="Toggle =/\= Comms =/\= highlighting — marks communication / transmission lines">=/\= Comms =/\=</button>
              <button class="tbb tbb-names fmt-on" id="tbb-th" onclick="toggleFmt('thought')" title="Toggle oO Thoughts Oo highlighting">oO Thoughts Oo</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="ec" class="hidden">
      <div id="editor" contenteditable="true" spellcheck="true" data-placeholder="Begin writing your sim here…" oncontextmenu="editorCtx(event)"></div>
    </div>
  </div>

  <!-- RESIZE HANDLE RIGHT -->
  <div class="resize-handle" id="rh-right" onmousedown="startResize(event,'right')"></div>

  <!-- SIM DETAILS / CHARACTERS PANEL -->
  <div id="cp">
    <div class="cp-top">
      <button class="panel-toggle" id="cp-toggle" onclick="toggleCharsPanel()" title="Toggle panel"><svg class="ic" aria-hidden="true"><use href="#i-chevron-right"/></svg></button>
      <span class="panel-label">SIM DETAILS</span>
    </div>
    <div id="sim-details" class="hidden">
      <!-- hidden date picker -->
      <input type="date" id="doc-posted-input" onchange="onPostedDateChange()">
      <div class="sd-body">
        <div class="sd-row">
          <span class="sd-lbl">Sim Type</span>
          <select id="doc-posttype" onchange="onPostTypeChange()" title="Sim type">
            <option value="">Regular</option>
            <option value="jp">JP</option>
            <option value="solo">Solo</option>
          </select>
        </div>
        <div class="sd-row">
          <span class="sd-lbl">Sim Status</span>
          <select id="doc-status" onchange="onStatusChange()">
            <option value="active">Active</option>
            <option value="complete">Complete</option>
            <option value="archived">Archived</option>
          </select>
        </div>
        <div class="sd-row">
          <span class="sd-lbl">Revisions</span>
          <button class="btn btn-s btn-sm" onclick="showHistory()" title="Revision snapshots"><svg class="ic" aria-hidden="true"><use href="#i-camera"/></svg> Snapshots</button>
        </div>
        <div class="sd-row">
          <button class="btn btn-s btn-sm" id="btn-post" onclick="openPostedCal()" title="Set posted date"><svg class="ic" aria-hidden="true"><use href="#i-calendar"/></svg> Post Date</button>
          <span class="sd-date" id="dh-date"></span>
        </div>
      </div>
      <div class="chars-divider">Characters in this sim</div>
    </div>
    <div id="chars-list"><div style="padding:10px;font-size:12px;color:var(--dim)">Open a sim to see characters</div></div>
  </div>

</div><!-- /workspace -->

<!-- SETTINGS VIEW — filled in by renderSettingsView(); a sibling of the
     workspace so it wears the same app header and the editor is never torn
     down behind it. -->
<div id="view-settings" class="view hidden"></div>

<!-- STATUS BAR -->
<div id="sb">
  <span id="s-doc">No sim open</span>
  <span id="s-wc">0 words</span>
  <div class="zc">
    <button class="zb" onclick="adjZoom(-10)">−</button>
    <span id="s-zoom" style="min-width:36px;text-align:center">100%</span>
    <button class="zb" onclick="adjZoom(10)">+</button>
  </div>
</div>

</div><!-- /app -->

<!-- CHARACTER MANIFEST (full-screen overlay) -->
<div id="char-manifest" class="hidden">
  <div id="cm-left">
    <div class="cm-hdr">
      <span>MANIFEST</span>
      <button class="cm-add-btn" onclick="addNewCharacter()">+ Add</button>
      <button class="cm-hdr-btn" onclick="refreshManifest()" title="Refresh stats"><svg class="ic" aria-hidden="true"><use href="#i-rotate-ccw"/></svg></button>
    </div>
    <div id="cm-filter"><input type="text" id="cm-filter-input" placeholder="Filter characters…" oninput="renderManifestList()"></div>
    <div id="cm-type-chips">
      <button class="cmtc on" data-type="" onclick="setTypeFilter('')">All</button>
      <button class="cmtc" data-type="Primary" onclick="setTypeFilter('Primary')">Primary</button>
      <button class="cmtc" data-type="Secondary" onclick="setTypeFilter('Secondary')">Secondary</button>
      <button class="cmtc" data-type="PNPC" onclick="setTypeFilter('PNPC')">PNPC</button>
      <button class="cmtc" data-type="MSPNPC" onclick="setTypeFilter('MSPNPC')">MSPNPC</button>
      <button class="cmtc" data-type="NPC" onclick="setTypeFilter('NPC')">NPC</button>
    </div>
    <div id="cm-sort-row">
      <span id="cm-sort-lbl">SORT</span>
      <select id="cm-sort-sel" onchange="setManifestSort(this.value)">
        <option value="type">Type &amp; Name</option>
        <option value="name">Name A–Z</option>
        <option value="sims">Most Sims</option>
        <option value="recent">Most Recent</option>
      </select>
    </div>
    <div id="cm-char-list"></div>
  </div>
  <div id="cm-right">
    <div id="cm-right-hdr">
      <div style="flex:1"></div>
      <button class="btn btn-s btn-sm" onclick="closeManifest()"><svg class="ic" aria-hidden="true"><use href="#i-pencil"/></svg> Sim Editor</button>
      <div class="tsep"></div>
      <div class="theme-picker">
        <button class="btn btn-s btn-sm" id="cm-theme-btn" title="Theme"><svg class="ic" aria-hidden="true"><use href="#i-moon"/></svg></button>
        <div class="theme-dropdown">
          <button class="theme-opt" data-theme="dark" onclick="setTheme('dark')"><svg class="ic" aria-hidden="true"><use href="#i-moon"/></svg> Dark</button>
          <button class="theme-opt" data-theme="light" onclick="setTheme('light')"><svg class="ic" aria-hidden="true"><use href="#i-sun"/></svg> Light</button>
          <button class="theme-opt" data-theme="hc" onclick="setTheme('hc')"><svg class="ic" aria-hidden="true"><use href="#i-contrast"/></svg> High Contrast</button>
          <button class="theme-opt" onclick="toggleSkin(this,event)"><svg class="ic" aria-hidden="true"><use href="#i-sparkles"/></svg> Delta Prime look</button>
        </div>
      </div>
      <button class="btn btn-s btn-sm" onclick="openSettings()"><svg class="ic" aria-hidden="true"><use href="#i-settings"/></svg> Settings</button>
    </div>
    <div id="cm-profile" class="cm-empty-msg">Select a character to view their profile.</div>
  </div>
</div>

<!-- MODAL -->
<div id="mo" class="hidden" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-title" id="mo-title"></div>
    <div id="mo-body"></div>
    <div class="ma" id="mo-actions">
      <button class="btn btn-s" onclick="closeModal()">Cancel</button>
      <button class="btn btn-p" onclick="doModal()">OK</button>
    </div>
  </div>
</div>

<!-- hidden file input for import -->
<input type="file" id="import-file" accept=".lcars,.json" style="display:none" onchange="onImportFile(event)">

<!-- CONTEXT MENU -->
<div id="ctx" class="hidden"></div>


<script src="lcars.js"></script>
</body>
</html>
